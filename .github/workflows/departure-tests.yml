name: Departure engine regression tests

on:
  push:
    branches: [android-ui-development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  departure-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Kotlin compiler and JVM test dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/departure-tests"
          cd "$RUNNER_TEMP/departure-tests"
          curl -fsSL --retry 2 -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.2.20/kotlin-compiler-2.2.20.zip
          echo '81f0264c9073b5cbbdb3ff8418cf2c5dac076879fc156fa1a6462f5a5acc4420  kotlin.zip' | sha256sum -c -
          unzip -q kotlin.zip
          curl -fsSL --retry 2 -o junit.jar https://repo.maven.apache.org/maven2/junit/junit/4.13.2/junit-4.13.2.jar
          curl -fsSL --retry 2 -o hamcrest.jar https://repo.maven.apache.org/maven2/org/hamcrest/hamcrest-core/1.3/hamcrest-core-1.3.jar
      - name: Compile actual engine sources and run regression tests without Android SDK
        shell: bash
        run: |
          set -euo pipefail
          TEST_TOOLS="$RUNNER_TEMP/departure-tests"
          SOURCE=app/src/main/java/com/prodigit/bodhiattendance
          TEST_SOURCE=app/src/test/java/com/prodigit/bodhiattendance
          "$TEST_TOOLS/kotlinc/bin/kotlinc" \
            "$SOURCE/domain/attendance/AttendanceStateMachine.kt" \
            "$SOURCE/domain/attendance/AttendanceEnginePhase.kt" \
            "$SOURCE/domain/attendance/AttendancePresenceDecisionEngine.kt" \
            "$SOURCE/domain/attendance/DeparturePhaseRecovery.kt" \
            "$SOURCE/core/monitoring/GpsEvidenceValidation.kt" \
            "$SOURCE/core/monitoring/DepartureEvidenceTracker.kt" \
            "$SOURCE/core/monitoring/OfflineWorkSessionPolicy.kt" \
            "$TEST_SOURCE/domain/attendance/AttendancePresenceDecisionEngineTest.kt" \
            "$TEST_SOURCE/domain/attendance/DeparturePhaseRecoveryTest.kt" \
            "$TEST_SOURCE/core/monitoring/GpsEvidenceValidationTest.kt" \
            "$TEST_SOURCE/core/monitoring/DepartureEvidenceTrackerTest.kt" \
            "$TEST_SOURCE/core/monitoring/OfflineWorkSessionPolicyTest.kt" \
            -cp "$TEST_TOOLS/junit.jar:$TEST_TOOLS/hamcrest.jar" \
            -include-runtime -d "$TEST_TOOLS/tests.jar"
          java -cp "$TEST_TOOLS/tests.jar:$TEST_TOOLS/junit.jar:$TEST_TOOLS/hamcrest.jar" org.junit.runner.JUnitCore \
            com.prodigit.bodhiattendance.domain.attendance.AttendancePresenceDecisionEngineTest \
            com.prodigit.bodhiattendance.domain.attendance.DeparturePhaseRecoveryTest \
            com.prodigit.bodhiattendance.core.monitoring.GpsEvidenceValidationTest \
            com.prodigit.bodhiattendance.core.monitoring.DepartureEvidenceTrackerTest \
            com.prodigit.bodhiattendance.core.monitoring.OfflineWorkSessionPolicyTest
