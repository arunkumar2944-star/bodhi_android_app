name: Bodhi Attendance APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-ui-development

permissions:
  contents: read

concurrency:
  group: bodhi-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BODHI_API_URL: https://crm-test-backend-phi.vercel.app/
    steps:
      - name: Checkout Android project
        uses: actions/checkout@v4

      - name: Configure JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 37
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"

      - name: Prepare Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build hosted-backend debug APK and unsigned release APK
        run: |
          ./gradlew --no-daemon --stacktrace \
            :app:assembleDebug :app:assembleRelease \
            -PbodhiApiBaseUrl="$BODHI_API_URL"

      - name: Upload internal testing APK
        uses: actions/upload-artifact@v4
        with:
          name: BodhiAttendance-Hosted-Test-Debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Check release signing configuration
        id: signing
        env:
          KEYSTORE_B64: ${{ secrets.BODHI_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BODHI_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BODHI_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BODHI_RELEASE_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_B64" && -n "$STORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No signed release APK: configure all four BODHI_RELEASE_* repository secrets."
          fi

      - name: Sign release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.BODHI_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.BODHI_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BODHI_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BODHI_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/bodhi-sign" "$RUNNER_TEMP/bodhi-output"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/bodhi-sign/release.jks"
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/37.0.0"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/bodhi-sign/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/bodhi-sign/release.jks" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$RUNNER_TEMP/bodhi-output/BodhiAttendance-Release-Signed.apk" \
            "$RUNNER_TEMP/bodhi-sign/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "$RUNNER_TEMP/bodhi-output/BodhiAttendance-Release-Signed.apk"
          rm -rf "$RUNNER_TEMP/bodhi-sign"

      - name: Upload signed release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: BodhiAttendance-Release-Signed
          path: ${{ runner.temp }}/bodhi-output/BodhiAttendance-Release-Signed.apk
          if-no-files-found: error
          retention-days: 30
